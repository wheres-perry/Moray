# ──────────────────────────────────────────────────────────────────────
# Project metadata
# ──────────────────────────────────────────────────────────────────────
[project]
name = "Moray"
version = "0.1.0"
description = "High-performance chess engine with ML evaluation"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.5",
    "python-chess>=1.999",
    "torch>=2.3.0",
]

[project.optional-dependencies]
analysis = ["jupyter", "pandas", "matplotlib", "seaborn"]

# ──────────────────────────────────────────────────────────────────────
# Dependency groups (PEP 735) — dev/CI tools only, not distributed
# ──────────────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "chess>=1.9.0",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-regressions>=2.5.0",
    "pytest-check>=2.2.0",
    "pytest-datadir>=1.5.0",
    "mypy>=1.7.0",
    "types-setuptools>=69.0.0",
    "ruff>=0.8.0",
    "pre-commit>=3.5.0",
    "nox>=2024.0.0",
    "clang-format>=22.1.0",
    "z3-solver>=4.12.0",
]

# ──────────────────────────────────────────────────────────────────────
# Build system — scikit-build-core (CMake + pybind11, no setup.py)
# ──────────────────────────────────────────────────────────────────────
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/engine"]
wheel.install-dir = "src"
install.strip = true
editable.mode = "inplace"

# ──────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "--cov=src/engine --cov-report=term-missing --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks benchmark tests",
    "integration: marks integration tests",
    "parity: marks parity/golden tests",
    "chess: marks chess puzzle / tactic tests",
]

# ──────────────────────────────────────────────────────────────────────
# Ruff — single source of truth (replaces ruff.toml)
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["notebooks/", ".nox/", "*.ipynb"]

[tool.ruff.lint]
select = [
    # Core
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    # Flake8 plugins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PL",  # pylint (via ruff — replaces standalone pylint)
    "RUF", # ruff-specific
    # Security & performance
    "S",    # flake8-bandit
    "PERF", # perflint
    # Complexity
    "C90", # mccabe
    # Error handling
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    # Import conventions
    "ICN", # flake8-import-conventions
    # Logging
    "G", # flake8-logging-format
    # Naming & quotes
    "N", # pep8-naming
    "Q", # flake8-quotes
    # Docstrings
    "D", # pydocstyle
]
ignore = [
    "ANN",     # type annotations — handled by mypy
    "F401",    # unused-import — Pylance/IDE handles
    "F841",    # unused-variable — Pylance/IDE handles
    "FBT001",  # boolean-positional-arg
    "FBT002",  # boolean-default-arg
    "PERF203", # try-except-in-loop
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    "PLR0915", # too-many-statements
    "S101",    # assert-used — common in tests/dev
    "S311",    # suspicious-non-cryptographic-random
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

# ──────────────────────────────────────────────────────────────────────
# MyPy
# ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
exclude = ["tests/", "notebooks/", "scripts/", "__pycache__/", ".*\\.egg-info/"]

[[tool.mypy.overrides]]
module = "engine._core"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "engine._core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "engine.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_return_any = false

# ──────────────────────────────────────────────────────────────────────
# UV
# ──────────────────────────────────────────────────────────────────────
[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
